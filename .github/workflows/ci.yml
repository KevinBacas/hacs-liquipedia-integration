name: CI & Release Candidate

# Triggered on every PR update and when labels are added/removed.
# Two jobs:
#   1. validate  – always runs: Ruff, pytest, hassfest, and HACS validation.
#   2. release-candidate – runs only when a bump label is present on the PR
#      (bump:patch, bump:minor, or bump:major) and validate passes.
#      It bumps manifest.json on top of the validated merge commit, tags that
#      commit with the workflow run number, and publishes the pre-release.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

# Default: restrict GITHUB_TOKEN to read-only; the release-candidate job
# overrides this with contents: write where it needs to push tags.
permissions:
  contents: read

# Cancel in-progress runs for the same PR when new commits or label changes arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Run lint, tests, hassfest, and HACS validation.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run Ruff
        run: python -m ruff check custom_components tests

      - name: Run pytest
        run: python -m pytest -q

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  # ---------------------------------------------------------------------------
  # Job 2: Create / update a release candidate pre-release.
  # Only runs when one of the bump labels is present on the PR.
  #   bump:patch  →  patch increment  (0.2.0 → 0.2.1)
  #   bump:minor  →  minor increment  (0.2.0 → 0.3.0)
  #   bump:major  →  major increment  (0.2.0 → 1.0.0)
  # ---------------------------------------------------------------------------
  release-candidate:
    name: Release Candidate
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (contains(github.event.pull_request.labels.*.name, 'bump:major') ||
      contains(github.event.pull_request.labels.*.name, 'bump:minor') ||
      contains(github.event.pull_request.labels.*.name, 'bump:patch'))
    steps:
      - name: Check out the validated PR merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # Require an unambiguous release decision.
      - name: Determine bump type
        id: bump
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          bump_count=$(jq '[.[] | select(. == "bump:major" or . == "bump:minor" or . == "bump:patch")] | length' <<< "$LABELS")
          if [ "$bump_count" -ne 1 ]; then
            echo "Exactly one bump label is required." >&2
            exit 1
          fi

          if jq -e 'index("bump:major")' <<< "$LABELS" > /dev/null; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif jq -e 'index("bump:minor")' <<< "$LABELS" > /dev/null; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      # Derive the next version from the latest stable tag. This keeps release
      # candidates monotonic when manifest.json has not yet been updated by a
      # stable release commit.
      - name: Compute next version
        id: version
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          existing_tag=$(git tag --list "v*-rc.${GITHUB_RUN_NUMBER}")
          if [ -n "$existing_tag" ]; then
            if [ "$(git rev-parse "$existing_tag^")" != "$GITHUB_SHA" ] ||
              [ "$(git show "$existing_tag:custom_components/liquipedia/manifest.json" | jq -er .version)" != "${existing_tag#v}" ]; then
              echo "Existing candidate tag does not match this run." >&2
              exit 1
            fi
            echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
            echo "version=${existing_tag#v}" >> "$GITHUB_OUTPUT"
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_tag=$(git tag -l 'v*' --sort=-version:refname | \
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)

          if [ -n "$current_tag" ]; then
            current="${current_tag#v}"
          else
            current=$(jq -er '.version' custom_components/liquipedia/manifest.json)
          fi

          IFS='.' read -r major minor patch <<< "$current"
          case "$BUMP_TYPE" in
            major) new="$((major + 1)).0.0" ;;
            minor) new="${major}.$((minor + 1)).0" ;;
            patch) new="${major}.${minor}.$((patch + 1))" ;;
            *) echo "Unknown bump type: $BUMP_TYPE" >&2; exit 1 ;;
          esac
          version="${new}-rc.${GITHUB_RUN_NUMBER}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Bump manifest.json and create RC tag
        if: steps.version.outputs.already_tagged != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' \
            custom_components/liquipedia/manifest.json > "$RUNNER_TEMP/manifest.json"
          mv "$RUNNER_TEMP/manifest.json" custom_components/liquipedia/manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/liquipedia/manifest.json

          git commit -m "chore: bump version to $VERSION"
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            exit 0
          fi

          gh release create "$TAG" --verify-tag \
            --title "$TAG – Release Candidate (PR #$PR_NUMBER)" \
            --notes "$(printf 'Preview for PR #%s: %s\n' "$PR_NUMBER" "$PR_TITLE")" \
            --prerelease
