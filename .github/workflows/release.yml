name: Validate and release

# A stable release is made only after a PR has actually been merged into main.
# Its version is selected explicitly with one of the bump labels documented in
# the README: bump:major, bump:minor, or bump:patch.
on:
  # Run from the trusted base workflow, including after a fork PR merges.
  # Both jobs check out commits from main only.
  pull_request_target:
    branches: [main]
    types: [closed]

# Serialise releases so two merged PRs cannot calculate the same next version.
concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  validate:
    name: Validate merged changes
    if: >-
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'bump:major') ||
      contains(github.event.pull_request.labels.*.name, 'bump:minor') ||
      contains(github.event.pull_request.labels.*.name, 'bump:patch'))
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.snapshot.outputs.commit }}
    steps:
      - name: Check out the merged PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Record the validated commit
        id: snapshot
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run Ruff
        run: python -m ruff check custom_components tests

      - name: Run pytest
        run: python -m pytest -q

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  release:
    name: Create stable release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the validated main commit and tags
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0

      - name: Determine version bump
        id: bump
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          bump_count=$(jq '[.[] | select(. == "bump:major" or . == "bump:minor" or . == "bump:patch")] | length' <<< "$LABELS")
          if [ "$bump_count" -ne 1 ]; then
            echo "Exactly one bump label is required." >&2
            exit 1
          fi

          if jq -e 'index("bump:major")' <<< "$LABELS" > /dev/null; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif jq -e 'index("bump:minor")' <<< "$LABELS" > /dev/null; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next stable version
        id: version
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}
        run: |
          # Recover a tag pushed by this run if release publication failed.
          existing_tag=$(git tag --list 'v*' \
            --format='%(refname:short) %(contents:subject)' | \
            awk -v run="$GITHUB_RUN_ID" '$0 == $1 " Release " $1 " (run " run ")" {print $1}')
          if [ -n "$existing_tag" ]; then
            if [ "$(git rev-parse "$existing_tag^")" != "$(git rev-parse HEAD)" ] ||
              [ "$(git show "$existing_tag:custom_components/liquipedia/manifest.json" | jq -er .version)" != "${existing_tag#v}" ]; then
              echo "Existing stable tag does not match this run." >&2
              exit 1
            fi
            echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The latest stable tag is the source of truth. This prevents a
          # stale manifest version from producing a release older than a tag.
          current_tag=$(git tag -l 'v*' --sort=-version:refname | \
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)

          if [ -n "$current_tag" ]; then
            if git merge-base --is-ancestor HEAD "$current_tag"; then
              echo "The latest stable tag already includes this merge." >&2
              exit 1
            fi
            current="${current_tag#v}"
          else
            current=$(jq -er '.version' custom_components/liquipedia/manifest.json)
          fi

          IFS='.' read -r major minor patch <<< "$current"
          case "$BUMP_TYPE" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="${major}.$((minor + 1)).0" ;;
            patch) next="${major}.${minor}.$((patch + 1))" ;;
            *) echo "Unknown bump type: $BUMP_TYPE" >&2; exit 1 ;;
          esac

          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - name: Update manifest, tag, and push
        if: steps.version.outputs.already_tagged != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          update_manifest() {
            jq --arg version "$VERSION" '.version = $version' \
              custom_components/liquipedia/manifest.json > "$RUNNER_TEMP/manifest.json"
            mv "$RUNNER_TEMP/manifest.json" custom_components/liquipedia/manifest.json
            git add custom_components/liquipedia/manifest.json
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          validated=$(git rev-parse HEAD)
          main=$(git rev-parse origin/main)
          git merge-base --is-ancestor "$validated" "$main"

          update_manifest
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "Release $TAG (run $GITHUB_RUN_ID)"

          # Later merges belong to main but outside this release's source tree.
          if [ "$main" != "$validated" ]; then
            git checkout --detach "$main"
            update_manifest
            if ! git diff --cached --quiet; then
              git commit -m "chore(release): sync manifest to $TAG"
            fi
          fi

          # If main moved again, neither ref is updated.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
